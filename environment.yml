# TacticalGraph environment.
#
# The version pins here are NOT arbitrary preferences: socceraction 1.5.3 requires
#   python <3.13, numpy <2.0, pandas <3.0
# and socceraction is load-bearing for this project (it provides the official SPADL
# converters for BOTH StatsBomb and Wyscout, plus xThreat/VAEP). Every pre-existing
# conda env on this machine violates those pins, hence a dedicated env.
#
#   conda env create -f environment.yml
#   conda activate tacticalgraph
name: tacticalgraph
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26            # socceraction pins <2
  - pandas=2.2            # socceraction pins <3
  - pyarrow>=15
  - scikit-learn>=1.3
  - scipy>=1.11
  - networkx>=3.2
  - matplotlib>=3.8
  - pyyaml
  - python-dotenv
  - tqdm
  - requests
  - psutil                # peak-RSS reporting (eval/resources.py)
  - pytest
  - pip
  - pip:
      # 2.6.0 is the oldest torch published for macOS arm64 / cp311; it is fine with
      # numpy 1.26. Do not "upgrade" numpy to satisfy a newer torch -- socceraction breaks.
      - torch==2.6.0
      - torch_geometric==2.6.1
      - socceraction==1.5.3
      - mplsoccer>=1.4
      - pandera==0.17.2   # socceraction's pin
      # pandera 0.17.x imports `overload` from multimethod, removed in multimethod 2.0.
      # Without this pin the whole socceraction.spadl import fails.
      - multimethod==1.10
      - umap-learn>=0.5
      - wandb>=0.16
      # Demo app. Verified not to disturb the pins above (numpy/pandas/pandera/torch/sklearn
      # are untouched), but it *does* try to downgrade pyarrow, hence the explicit floor.
      - streamlit>=1.40
      - pyarrow>=25

# NOTE on this machine: a system Python 3.13 framework pip shadows the env on PATH.
# Always install with `python -m pip`, never bare `pip`, or you get cp313 wheels and
# spurious "no matching distribution" errors for socceraction.
